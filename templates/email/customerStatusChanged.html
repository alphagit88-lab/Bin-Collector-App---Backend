<h1 style="margin:0 0 18px;font-size:24px;color:#111827;">Your Account Status Has Changed</h1>
<p style="margin:0 0 14px;line-height:1.6;">Hello {{name}},</p>
<p style="margin:0 0 14px;line-height:1.6;">Your customer account with <strong>{{supplierName}}</strong> on BinDrop has been <strong>{{action}}</strong>.</p>
<div style="margin:24px 0;padding:20px;background:{{badgeBg}};border:1px solid {{badgeBorder}};border-left:4px solid {{badgeAccent}};border-radius:8px;">
  <p style="margin:0 0 6px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:{{badgeAccent}};">Account Status</p>
  <p style="margin:0;font-size:18px;font-weight:700;color:#111827;">{{statusLabel}}</p>
  <p style="margin:8px 0 0;color:#374151;line-height:1.6;font-size:14px;">{{statusDescription}}</p>
</div>
<table role="presentation" cellspacing="0" cellpadding="0" align="center" style="margin:24px auto 18px;text-align:center;">
  <tr>
    <td style="border-radius:6px;background:#10b981;text-align:center;">
      <a href="{{webLoginUrl}}" style="display:inline-block;padding:9px 18px;color:#ffffff;text-decoration:none;font-weight:600;font-size:13px;border-radius:6px;line-height:1.4;">Sign In</a>
    </td>
    <td style="width:10px;"></td>
    <td style="border-radius:6px;background:#0f172a;text-align:center;">
      <a href="https://app.bindrop.ai/open-app" style="display:inline-block;padding:9px 18px;color:#ffffff;text-decoration:none;font-weight:600;font-size:13px;border-radius:6px;line-height:1.4;">Open in Mobile App</a>
    </td>
  </tr>
</table>
<p style="margin:28px 0 0;padding-top:20px;border-top:1px solid #e5e7eb;color:#6b7280;line-height:1.6;font-size:13px;">If you have any questions, please contact BinDrop support.</p>
